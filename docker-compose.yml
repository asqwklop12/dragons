version: "3.8"

services:
  dragons-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dragons:${PROFILE:-dev}
    container_name: dragons
    restart: unless-stopped

    ports:
      - "8083:8083"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      SERVER_PORT: 8083
      # Spring relaxed binding: DATASOURCE_REDIS_ENABLED -> datasource.redis.enabled
      DATASOURCE_REDIS_ENABLED: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT: ${GOOGLE_REDIRECT}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      UI_URL: ${UI_URL}
      DB_HOST: ${DB_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_SCHEMA: ${MYSQL_SCHEMA}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PWD}
      SLOW_LOGPATH: ${SLOW_LOGPATH}
      # Optional JVM tuning
      JAVA_OPTS: "-XX:+UseContainerSupport -Xms256m -Xmx512m"
    # Rely on Dockerfile ENTRYPOINT (java -jar /app/app.jar)
networks:
  default:
    external: true
    name: dragons_default
