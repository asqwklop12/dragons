spring:
  application:
    name: dragons
  config:
    import:
      - logging.yml
      - jwt.yml
      - optional:redis.yml
      - jpa.yml
      - social.yml
server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
      timeout: 30m
  port: 8082
datasource:
  redis:
    enabled: false
springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html
logging:
  request-response:
    enabled: true
    body-enabled: true
    max-body-size: 10240  # 10KB
---
spring:
  config:
    activate:
      on-profile: dev
  hello: ????
server:
  port: 8083
  servlet:
    session:
      cookie:
        secure: false
        same-site: lax
        http-only: true
      timeout: 30m
---
spring:
  config:
    activate:
      on-profile: local
  hello: ????
server:
  port: 8089
  servlet:
    session:
      cookie:
        secure: false
        same-site: lax
        http-only: true
      timeout: 30m
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  request-response:
    body-enabled: false  # 프로덕션에서는 바디 로깅 비활성화
    max-body-size: 1024  # 더 작은 크기
