spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        timezone.default_storage: NORMALIZE_UTC
        jdbc.time_zone: UTC

datasource:
  mysql-jpa:
    main:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/dragons
      username: application
      password: application
      pool-name: mysql-main-pool
      maximum-pool-size: 40
      minimum-idle: 30

    replica:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3307/dragons
      username: root
      password: application
      pool-name: mysql-replica-pool
      maximum-pool-size: 40
      minimum-idle: 30

---
spring.config.activate.on-profile: local

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://localhost:3306/dragons
      username: application
      password: application
    replica:
      jdbc-url: jdbc:mysql://localhost:3307/dragons
      username: root
      password: application

---
spring.config.activate.on-profile: test

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/dragons
      username: ${MYSQL_USER}
      password: ${MYSQL_PWD}
      maximum-pool-size: 10
      minimum-idle: 5

---
spring.config.activate.on-profile: dev

spring:
  jpa:
    show-sql: true

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://host.docker.internal:3306/dragons
      username: application
      password: application
    replica:
      jdbc-url: jdbc:mysql://host.docker.internal:3307/dragons
      username: root
      password: application

---
spring.config.activate.on-profile: prod

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://mysql8:3306/dragons
      username: admin
      password: admin
    replica:
      jdbc-url: jdbc:mysql://mysql8:3307/dragons
      username: root
      password: application
