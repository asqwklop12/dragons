global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: dragons-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - dragons1:9797
          - dragons2:9797
          - dragons3:9797
